[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-card-maker"
version = "0.1.0"
description = "把 PDF 或读书笔记自动转换成 Anki 卡片（本科毕业设计）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.18",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6",
    "jinja2>=3.1",
    "platformdirs>=4",
    "numpy",
    "pillow",
    "PySide6-Essentials>=6.7",
    "genanki>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 本地 Qwen3-TTS 发音（只支持 Apple 芯片的 Mac）
local-tts = ["mlx-audio>=0.5.7; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
cardmaker = "cardmaker.cli:main"

[project.gui-scripts]
cardmaker-gui = "cardmaker.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cardmaker = ["templates/builtin/*.yaml", "export/*.html", "gui/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 需要加载 OCR 模型、耗时较长的测试"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
