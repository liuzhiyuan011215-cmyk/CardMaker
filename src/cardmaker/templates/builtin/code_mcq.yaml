id: code_mcq
name: 编程技术 · 选择题
icon: 💻
order: 8
group: code
group_name: 编程技术
variant: 选择题
description: 编程书、技术文档：关键概念、API、语法做成填空卡和选择题，代码保留格式。
note_type: mcq
dedup_key: question
tags: ["CardMaker::编程"]

params:
  max_per_page:
    label: 每页最多几题
    type: int
    default: 6

system_prompt: |
  你是一位经验丰富的程序员和讲师，擅长根据技术资料出单项选择题。
  你必须依据给出的原文，不编造原文没有的内容。你只输出 json。

user_prompt: |
  任务：根据【本页正文】出单项选择题（四选一），考查概念理解、API 用法、代码的运行结果。

  规则：
  1. 只根据【本页正文】出题，正确答案必须能从原文得出。
  2. 一题只考一个要点。题干如果需要一段代码，把代码（最多 8 行）放进 code 字段，题干里写「下面这段代码……」。
  3. correct：正确答案；distractors：3 个错误但似是而非的选项（常见误解、相近的 API 名称），不能也是正确的。
  4. explanation：一两句话解释为什么选这个。
  5. quote：出题依据的原文句子，从正文原样复制。
  6. 每页最多 {{ max_per_page }} 题，宁缺毋滥。【上一页末尾】只用来帮助理解，不要从中出题。

  {{ output_format }}

  【上一页末尾】
  {{ context or "（无）" }}

  【本页正文】（{{ book_title }}，第 {{ page_label }} 页{% if chapter %}，{{ chapter }}{% endif %}）
  {{ text }}

output:
  list_key: items
  grounded: [quote]
  mcq: true
  fields:
    question: {label: "题目", required: true, description: "题干"}
    code: {label: "代码", description: "题干需要的代码，没有就留空"}
    correct: {label: "正确答案", required: true, description: "正确选项的内容"}
    distractors: {label: "干扰项", type: list, required: true, min_items: 3, description: "3 个错误但似是而非的选项"}
    explanation: {label: "解析", description: "为什么选这个"}
    quote: {label: "原文", required: true, description: "出题依据的原文句子，原样复制"}

card_fields:
  Question: "{{ question }}{% if code %}{{ code | code_block }}{% endif %}"
  A: "{{ option_a }}"
  B: "{{ option_b }}"
  C: "{{ option_c }}"
  D: "{{ option_d }}"
  Answer: "{{ answer }}"
  Explanation: "{{ explanation }}"
  SourceText: "{{ quote }}"
  Source: "{{ source }}"
