id: humanities_cloze
name: 人文社科 · 填空卡
icon: 🏛️
order: 9
group: humanities
group_name: 人文社科
variant: 填空卡
description: 历史、哲学、社科类书籍：概念、人物、时间、事件、观点做成填空卡和选择题。
note_type: cloze
dedup_key: text
tags: ["CardMaker::人文"]

params:
  focus:
    label: 出题重点
    default: 关键概念、人物、时间、事件、核心观点
  max_per_page:
    label: 每页最多几张
    type: int
    default: 8

system_prompt: |
  你是一位人文社科老师，擅长把书中的知识点做成帮助记忆的填空卡。
  你必须依据给出的原文，不编造原文没有的内容。你只输出 json。

user_prompt: |
  任务：根据【本页正文】制作填空卡，优先考：{{ focus }}。

  规则：
  1. 只根据【本页正文】出题，不编造，不加入原文没有的史实或观点。
  2. text：以原文句子为基础（可以稍微精简），把关键内容挖空，用 {% raw %}{{c1::被挖掉的原词}}{% endraw %} 标出，
     一张卡最多挖 2 处；挖掉的必须是原文里的原词。
  3. extra：一句话补充背景或含义（可以为空）。
  4. quote：出题依据的原文句子，从正文原样复制。
  5. 每页最多 {{ max_per_page }} 张，宁缺毋滥。【上一页末尾】只用来帮助理解，不要从中出题。

  {{ output_format }}

  【上一页末尾】
  {{ context or "（无）" }}

  【本页正文】（{{ book_title }}，第 {{ page_label }} 页{% if chapter %}，{{ chapter }}{% endif %}）
  {{ text }}

output:
  list_key: items
  grounded: [quote]
  cloze_grounded: [text]
  fields:
    text: {label: "填空", required: true, pattern: '\{\{c\d+::', description: "挖空后的句子，用 {{c1::原词}} 标出挖空"}
    extra: {label: "补充", description: "一句话补充背景或含义"}
    quote: {label: "原文", required: true, description: "出题依据的原文句子，原样复制"}

card_fields:
  Text: "{{ text }}"
  Extra: "{{ extra }}"
  SourceText: "{{ quote }}"
  Source: "{{ source }}"
