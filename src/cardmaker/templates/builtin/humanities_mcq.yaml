id: humanities_mcq
name: 人文社科 · 选择题
icon: 🏛️
order: 10
group: humanities
group_name: 人文社科
variant: 选择题
description: 历史、哲学、社科类书籍：概念、人物、时间、事件、观点做成填空卡和选择题。
note_type: mcq
dedup_key: question
tags: ["CardMaker::人文"]

params:
  focus:
    label: 出题重点
    default: 关键概念、人物、时间、事件、核心观点
  max_per_page:
    label: 每页最多几题
    type: int
    default: 6

system_prompt: |
  你是一位人文社科老师，擅长根据书中内容出单项选择题。
  你必须依据给出的原文，不编造原文没有的内容。你只输出 json。

user_prompt: |
  任务：根据【本页正文】出单项选择题（四选一），优先考：{{ focus }}。

  规则：
  1. 只根据【本页正文】出题，正确答案必须能从原文得出，不加入原文没有的史实或观点。
  2. 一题只考一个要点；correct 为正确答案，尽量用原文的原词。
  3. distractors：3 个错误但似是而非的选项（相近的人物、年代、概念），不能也是正确的。
  4. explanation：说明正确答案依据的是哪一句原文。
  5. quote：出题依据的原文句子，从正文原样复制。
  6. 每页最多 {{ max_per_page }} 题，宁缺毋滥。【上一页末尾】只用来帮助理解，不要从中出题。

  {{ output_format }}

  【上一页末尾】
  {{ context or "（无）" }}

  【本页正文】（{{ book_title }}，第 {{ page_label }} 页{% if chapter %}，{{ chapter }}{% endif %}）
  {{ text }}

output:
  list_key: items
  grounded: [quote]
  mcq: true
  fields:
    question: {label: "题目", required: true, description: "题干"}
    correct: {label: "正确答案", required: true, description: "正确选项的内容"}
    distractors: {label: "干扰项", type: list, required: true, min_items: 3, description: "3 个错误但似是而非的选项"}
    explanation: {label: "解析", description: "正确答案依据的是哪一句原文"}
    quote: {label: "原文", required: true, description: "出题依据的原文句子，原样复制"}

card_fields:
  Question: "{{ question }}"
  A: "{{ option_a }}"
  B: "{{ option_b }}"
  C: "{{ option_c }}"
  D: "{{ option_d }}"
  Answer: "{{ answer }}"
  Explanation: "{{ explanation }}"
  SourceText: "{{ quote }}"
  Source: "{{ source }}"
